<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>班級學習島冒險平台</title>

  <!-- 3D 渲染庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase 即時資料庫 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      background-color: #dbeafe;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #canvas-container { position: absolute; inset: 0; z-index: 1; }

    /* 頂端即時推播廣播跑馬燈 */
    .live-banner {
      position: fixed;
      top: -70px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 10px 25px rgba(217, 119, 6, 0.4);
      z-index: 10000;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
    }
    .live-banner.show { top: 20px; }

    /* 頂部操作介面列 */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .hud-header > * { pointer-events: auto; }

    /* 全班協作能量條 */
    .energy-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2px solid #fed7aa;
    }
    .energy-label { font-weight: 800; color: #ea580c; font-size: 0.9rem; }
    .energy-track {
      width: 150px;
      height: 14px;
      background: #fed7aa;
      border-radius: 10px;
      overflow: hidden;
    }
    .energy-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f97316, #eab308);
      transition: width 0.5s ease;
    }
    .energy-text { font-size: 0.85rem; font-weight: bold; color: #7c2d12; }

    /* 學生個人身分卡片 */
    .profile-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: 2px solid #bae6fd;
      transition: transform 0.2s;
    }
    .profile-card:hover { transform: scale(1.05); }
    .user-avatar { font-size: 1.5rem; }
    .user-name { font-weight: 800; color: #0369a1; font-size: 0.95rem; }

    /* 底部引導提示文字 */
    .hud-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.7);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    /* 通用彈窗樣式 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      transition: opacity 0.25s;
    }
    .modal-overlay.hidden { opacity: 0; pointer-events: none; }

    .modal-card {
      background: #ffffff;
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      border: 4px solid #fef08a;
      animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop {
      0% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-title { font-size: 1.4rem; font-weight: 800; color: #1e293b; }
    .modal-close {
      background: #f1f5f9;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.9rem; font-weight: bold; color: #475569; }
    .form-group input, .form-group textarea {
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
      font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: #3b82f6; }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 6px;
    }
    .avatar-opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 8px 4px;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .avatar-opt.selected { border-color: #3b82f6; background: #eff6ff; }
    .avatar-opt span { font-size: 0.75rem; color: #475569; font-weight: bold; margin-top: 4px; }

    .btn-action {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 5px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }
    .btn-action:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
    .btn-blue { background: #3b82f6; box-shadow: 0 5px 0 #1d4ed8; }
    .btn-green { background: #10b981; box-shadow: 0 5px 0 #047857; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="live-banner" class="live-banner"></div>

  <!-- 頂部 HUD -->
  <div class="hud-header">
    <div class="energy-card">
      <span class="energy-label">⚡ 全班共創能量</span>
      <div class="energy-track">
        <div id="class-energy-bar" class="energy-fill"></div>
      </div>
      <span id="class-energy-text" class="energy-text">0 / 1000</span>
    </div>

    <div class="profile-card" id="profile-btn">
      <span class="user-avatar" id="hud-avatar">🦊</span>
      <span class="user-name" id="hud-name">點我設定</span>
    </div>
  </div>

  <div class="hud-hint">👆 點擊島嶼探索任務，單指滑動旋轉視角</div>

  <!-- 學生開場身分設定彈窗 -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">🎒 歡迎來到學習島！</h2>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>座號</label>
          <input type="number" id="input-seat" placeholder="例如: 12" min="1" max="50">
        </div>
        <div class="form-group" style="flex:2;">
          <label>姓名 / 暱稱</label>
          <input type="text" id="input-name" placeholder="例如: 小宇" maxlength="10">
        </div>
      </div>
      <div class="form-group">
        <label>挑選你的探險夥伴</label>
        <div class="avatar-grid">
          <button type="button" class="avatar-opt selected" data-avatar="🦊">🦊<span>小狐</span></button>
          <button type="button" class="avatar-opt" data-avatar="🐻">🐻<span>大熊</span></button>
          <button type="button" class="avatar-opt" data-avatar="🐰">🐰<span>飛兔</span></button>
          <button type="button" class="avatar-opt" data-avatar="🦉">🦉<span>貓頭鷹</span></button>
          <button type="button" class="avatar-opt" data-avatar="🐼">🐼<span>熊貓</span></button>
          <button type="button" class="avatar-opt" data-avatar="🦁">🦁<span>獅子</span></button>
          <button type="button" class="avatar-opt" data-avatar="🐬">🐬<span>海豚</span></button>
          <button type="button" class="avatar-opt" data-avatar="🚀">🚀<span>火箭客</span></button>
        </div>
      </div>
      <button class="btn-action btn-blue" id="btn-save-profile">✨ 進入學習島！</button>
    </div>
  </div>

  <!-- 一般任務打卡彈窗 -->
  <div id="task-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="task-island-title">島嶼任務</h2>
        <button class="modal-close" onclick="closeModal('task-modal')">×</button>
      </div>
      <div style="margin-bottom:18px;">
        <h3 id="task-name" style="color:#2563eb; margin-bottom:6px;"></h3>
        <p id="task-desc" style="color:#64748b; line-height:1.5;"></p>
      </div>
      <button class="btn-action btn-green" id="btn-complete-task">🌟 完成挑戰並打卡 (+50 能量)</button>
    </div>
  </div>

  <!-- 閱讀島專用：閱讀心得與想法彈窗 -->
  <div id="reading-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">📖 閱讀心得與想法紀錄</h2>
        <button class="modal-close" onclick="closeModal('reading-modal')">×</button>
      </div>
      <div class="form-group">
        <label>閱讀書名或文章主題</label>
        <input type="text" id="input-book-title" placeholder="例如: 昆蟲記、夏之庭...">
      </div>
      <div class="form-group">
        <label>我的閱讀心得與收穫想法</label>
        <textarea id="input-reflection" rows="4" placeholder="寫下一句最讓你印象深刻的話，或你的發現..."></textarea>
      </div>
      <button class="btn-action btn-blue" id="btn-submit-reading">📝 送出心得 (+50 能量)</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 金鑰與雲端設定區（請在此處填入你的設定）
    // ==========================================

    // (A) Firebase 設定（貼上你在 Firebase 專案設定複製的內容）
    const firebaseConfig = {
      apiKey: "AIzaSyAiQtbWb4ewd3322xfMo5eKQ3S-rG4Xfmg",
      authDomain: "gseslearning-island.firebaseapp.com",
      databaseURL: "https://gseslearning-island-default-rtdb.firebaseio.com",
      projectId: "gseslearning-island",
      storageBucket: "gseslearning-island.firebasestorage.app",
      messagingSenderId: "47110742027",
      appId: "1:47110742027:web:e3781ccb0d5d71b442270e",
      measurementId: "G-JX7MR06NHW"
    };

    // (B) Google Apps Script Web App 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxpgYPXZQAyR2Qn1OLejnUMekxvOW1Bf9-U6DyBwFoaw-st0tkQT7K8yxsU3zyXhrGj/exec";

    // 初始化 Firebase
    let db = null;
    let totalEnergyRef = null;
    let liveFeedRef = null;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      totalEnergyRef = db.ref('island_stats/total_energy');
      liveFeedRef = db.ref('island_stats/recent_activity');
    } catch(err) {
      console.warn("Firebase 初始化提示：請確認金鑰已正確填入！", err);
    }

    // ==========================================
    // 2. 學生身分與狀態管理 (LocalStorage)
    // ==========================================
    let currentStudent = { seatNumber: '', name: '小探險家', avatar: '🦊' };

    function initStudent() {
      const saved = localStorage.getItem('learning_island_student');
      if (saved) {
        try {
          currentStudent = JSON.parse(saved);
          updateHudProfile();
          document.getElementById('login-modal').classList.add('hidden');
        } catch(e){}
      }
    }

    function updateHudProfile() {
      document.getElementById('hud-avatar').textContent = currentStudent.avatar;
      document.getElementById('hud-name').textContent = `${currentStudent.seatNumber}號 ${currentStudent.name}`;
    }

    // 頭像切換
    document.querySelectorAll('.avatar-opt').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.avatar-opt').forEach(b => b.classList.remove('selected'));
        opt.classList.add('selected');
        currentStudent.avatar = opt.dataset.avatar;
      });
    });

    // 儲存身分
    document.getElementById('btn-save-profile').addEventListener('click', () => {
      const seat = document.getElementById('input-seat').value.trim();
      const name = document.getElementById('input-name').value.trim();
      if (!seat || !name) {
        alert('請先填寫座號與名字喔！');
        return;
      }
      currentStudent.seatNumber = seat;
      currentStudent.name = name;
      localStorage.setItem('learning_island_student', JSON.stringify(currentStudent));
      updateHudProfile();
      document.getElementById('login-modal').classList.add('hidden');
    });

    document.getElementById('profile-btn').addEventListener('click', () => {
      document.getElementById('input-seat').value = currentStudent.seatNumber;
      document.getElementById('input-name').value = currentStudent.name;
      document.getElementById('login-modal').classList.remove('hidden');
    });

    // ==========================================
    // 3. 雙軌雲端發送：Firebase 即時 + Google 試算表存檔
    // ==========================================

    // 發送至 Google Apps Script
    async function sendToGAS(payload) {
      if (!GAS_API_URL || GAS_API_URL.includes("請替換")) return;
      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      } catch(e) {
        console.error("GAS 寫入失敗", e);
      }
    }

    // 發送任務打卡
    function completeTask(island) {
      confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
      closeModal('task-modal');

      // 1. Firebase 即時累加能量與廣播
      if (totalEnergyRef) {
        totalEnergyRef.transaction(val => (val || 0) + 50);
        liveFeedRef.push({
          studentName: `${currentStudent.seatNumber}號 ${currentStudent.avatar} ${currentStudent.name}`,
          message: `完成【${island.title}】的任務！`,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
      }

      // 2. 存入 Google 試算表（任務打卡分頁）
      sendToGAS({
        type: 'task_complete',
        seatNumber: currentStudent.seatNumber,
        studentName: `${currentStudent.avatar} ${currentStudent.name}`,
        islandTitle: island.title,
        taskTitle: island.taskTitle,
        points: 50
      });
    }

    // 發送閱讀心得
    function submitReadingReflection() {
      const book = document.getElementById('input-book-title').value.trim();
      const reflection = document.getElementById('input-reflection').value.trim();
      if (!book || !reflection) {
        alert('請先輸入閱讀的書名與簡短心得喔！');
        return;
      }

      confetti({ particleCount: 80, spread: 70, origin: { y: 0.7 } });
      closeModal('reading-modal');

      // 1. Firebase 即時動態廣播
      if (totalEnergyRef) {
        totalEnergyRef.transaction(val => (val || 0) + 50);
        liveFeedRef.push({
          studentName: `${currentStudent.seatNumber}號 ${currentStudent.avatar} ${currentStudent.name}`,
          message: `分享了《${book}》的閱讀心得！`,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
      }

      // 2. 存入 Google 試算表（閱讀心得與想法分頁）
      sendToGAS({
        type: 'reading_reflection',
        seatNumber: currentStudent.seatNumber,
        studentName: `${currentStudent.avatar} ${currentStudent.name}`,
        bookTitle: book,
        reflection: reflection
      });

      document.getElementById('input-book-title').value = '';
      document.getElementById('input-reflection').value = '';
    }

    document.getElementById('btn-submit-reading').addEventListener('click', submitReadingReflection);

    // ==========================================
    // 4. Firebase 監聽：全班連動能量條與跑馬燈
    // ==========================================
    if (totalEnergyRef) {
      totalEnergyRef.on('value', snap => {
        const energy = snap.val() || 0;
        const max = 1000;
        const pct = Math.min((energy / max) * 100, 100);
        document.getElementById('class-energy-bar').style.width = `${pct}%`;
        document.getElementById('class-energy-text').textContent = `${energy} / ${max}`;
      });
    }

    if (liveFeedRef) {
      let isFirstLoad = true;
      liveFeedRef.limitToLast(1).on('child_added', snap => {
        if (isFirstLoad) { isFirstLoad = false; return; }
        const data = snap.val();
        if (data) showLiveBanner(`🎉 ${data.studentName} ${data.message} (+50 能量)`);
      });
    }

    function showLiveBanner(text) {
      const banner = document.getElementById('live-banner');
      banner.textContent = text;
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 4000);
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    // ==========================================
    // 5. Three.js 3D 島嶼場景建構
    // ==========================================
    const ISLAND_CONFIG = [
      { id: 'nature', title: '生態科學島', taskTitle: '校園昆蟲與植物觀察', taskDesc: '在校園花圃中找到一種特別的葉子或昆蟲，並記錄特徵！', color: 0x4ade80, pos: [-14, 0, -8], type: 'task' },
      { id: 'space', title: '探索宇宙島', taskTitle: '八大行星小知識挑戰', taskDesc: '說出離太陽最近的一顆行星，以及它有什麼特別之處！', color: 0x38bdf8, pos: [14, 2, -10], type: 'task' },
      { id: 'reading', title: '閱讀魔法島', taskTitle: '閱讀心得記錄', taskDesc: '寫下你今天閱讀的一本書或一篇文章，把收穫分享給大家！', color: 0xf472b6, pos: [-8, -2, 12], type: 'reading' },
      { id: 'civics', title: '班級公民島', taskTitle: '班級整潔生活提案', taskDesc: '提出一個讓走廊保持乾淨、大家玩得更安全的好點子！', color: 0xfbbf24, pos: [10, -1, 10], type: 'task' }
    ];

    let scene, camera, renderer, controls;
    let islandMeshes = [];
    let currentActiveIsland = null;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xdbeafe);
      scene.fog = new THREE.FogExp2(0xdbeafe, 0.02);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 32, 42);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2.1;
      controls.minDistance = 15;
      controls.maxDistance = 65;

      // 燈光
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x93c5fd, 0.9);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffedd5, 1.2);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      // 產生 4 座島嶼
      ISLAND_CONFIG.forEach(cfg => {
        const group = new THREE.Group();
        group.position.set(...cfg.pos);

        // 基座
        const baseGeo = new THREE.CylinderGeometry(5.5, 3.2, 4.5, 7);
        const baseMat = new THREE.MeshStandardMaterial({ color: cfg.color, flatShading: true });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = -2;
        group.add(base);

        // 島上裝飾地標
        const decoGeo = cfg.id === 'reading' 
          ? new THREE.BoxGeometry(3, 2, 2)
          : new THREE.ConeGeometry(2, 4, 5);
        const decoMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
        const deco = new THREE.Mesh(decoGeo, decoMat);
        deco.position.y = 2;
        group.add(deco);

        group.userData = cfg;
        scene.add(group);
        islandMeshes.push(group);
      });

      // 點擊島嶼射線偵測
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      function onPointerDown(e) {
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        if (!clientX || !clientY) return;

        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(islandMeshes, true);

        if (intersects.length > 0) {
          let target = intersects[0].object;
          while (target.parent && target.parent !== scene) {
            target = target.parent;
          }
          if (target.userData && target.userData.id) {
            handleIslandClick(target.userData);
          }
        }
      }

      window.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // 動畫迴圈（浮動呼吸效果）
      let clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        islandMeshes.forEach((island, i) => {
          island.position.y = ISLAND_CONFIG[i].pos[1] + Math.sin(time * 1.5 + i) * 0.4;
          island.rotation.y += 0.003;
        });
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function handleIslandClick(cfg) {
      currentActiveIsland = cfg;
      if (cfg.type === 'reading') {
        document.getElementById('reading-modal').classList.remove('hidden');
      } else {
        document.getElementById('task-island-title').textContent = cfg.title;
        document.getElementById('task-name').textContent = cfg.taskTitle;
        document.getElementById('task-desc').textContent = cfg.taskDesc;
        document.getElementById('task-modal').classList.remove('hidden');
      }
    }

    document.getElementById('btn-complete-task').addEventListener('click', () => {
      if (currentActiveIsland) completeTask(currentActiveIsland);
    });

    // 啟動程序
    initStudent();
    init3D();
  </script>
</body>
</html>
